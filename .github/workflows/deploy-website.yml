name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "README*.md"
      - "package.json"
      - ".github/workflows/deploy-website.yml"

  release:
    types: [released]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history so each page gets an accurate git-based lastmod.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install dependencies
        run: pip install -r website/requirements.txt

      - name: Cache fonts and images
        uses: actions/cache@v4
        with:
          path: |
            website/.cache/fonts
            website/.cache/subsets
            website/.cache/images
          key: website-cache-${{ hashFiles('website/aqsite/config.py', 'website/aqsite/fonts.py', 'website/aqsite/images.py') }}
          restore-keys: website-cache-

      - name: Build static site
        run: python website/build.py build --out website/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
