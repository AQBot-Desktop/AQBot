[workspace]
members = [".", "crates/core", "crates/providers", "crates/gateway", "crates/migration", "crates/agent", "crates/acp-client"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
sqlite-vec = "0.1.8-alpha.1"
libsqlite3-sys = "0.30"

[package]
name = "aqbot"
version = "0.0.1"
description = "AQBot - AI Chat Desktop App"
authors = ["you"]
license = "AGPL-3.0-only"
edition = "2021"
default-run = "AQBot"

[lib]
name = "aqbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AQBot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
aqbot-core = { path = "crates/core" }
aqbot-providers = { path = "crates/providers" }
aqbot-agent = { path = "crates/agent" }
aqbot-acp-client = { path = "crates/acp-client" }
open-agent-sdk = { path = "crates/open-agent-sdk" }
aqbot-gateway = { path = "crates/gateway" }
tokio = { workspace = true }
uuid = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tauri-plugin-mcp-bridge = "0.2"
font-kit = "0.14"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", features = ["json"] }
csv = "1"
zip = "2"
tempfile = "3"
open = "5"
urlencoding = "2"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-single-instance = { version = "=2.4.0", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["relax-sign-encoding"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSRunningApplication",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "libc",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSNotification",
    "NSURL",
    "NSObject",
    "NSOperation",
    "NSString",
    "block2",
] }
plist = "1"
block2 = "0.6.2"
axuielement = { version = "0.9.1", features = ["async"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
# Nonactivating NSPanel for the selection toolbar (hover + click without activating the app).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.25.0", features = ["event"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30.0", features = ["tokio"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[patch.crates-io]
tauri-plugin-mcp-bridge = { path = "patches/tauri-plugin-mcp-bridge" }
